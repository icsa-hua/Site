<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Βραδιά του Ερευνητή — Research Projects</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root {
    --card-mosaic: #E8916B;
    --card-remerge: #3FC7B4;
    --card-codrones: #7B9FE0;
    --card-archipelago: #E0A855;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 64px;
  }

  /* ---------- Header ---------- */
  header {
    width: 100%;
    max-width: 1080px;
  }

  .logos {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding: 8px 0 28px;
  }

  .logos img {
    display: block;
    object-fit: contain;
  }

  .logo-hua { height: 60px; }
  .logo-icsa { height: 60px; }
  .logo-vradia {
    height: 122px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  }

  .logos > a:first-child { order: 1; }
  .logos > a:nth-child(2) { order: 2; margin: 0 auto; }
  .logos > a:last-child { order: 3; }

  hr {
    border: none;
    border-top: 1px solid var(--line);
    width: 100%;
    max-width: 1080px;
    margin: 0 0 40px;
  }

  main {
    width: 100%;
    max-width: 1080px;
  }

  /* ---------- Tabs ---------- */
  @property --tab-angle {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }

  @keyframes tab-border-spin {
    to { --tab-angle: 360deg; }
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 14px;
    width: 100%;
    max-width: 1080px;
    padding: 28px 0 32px;
  }

  .tab-btn {
    position: relative;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 15px 34px;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
  }

  .tab-btn .tab-label {
    background: linear-gradient(90deg, var(--sphere-1), var(--sphere-2) 50%, var(--sphere-3) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    opacity: 0.5;
    transition: opacity 0.25s ease;
  }

  .tab-btn:hover {
    border-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-1px);
  }

  .tab-btn:hover .tab-label {
    opacity: 0.8;
  }

  .tab-btn.active {
    background: var(--surface-strong);
    border-color: transparent;
  }

  .tab-btn.active .tab-label {
    opacity: 1;
  }

  /* Neon perimeter animation on the selected tab, in the theme's sphere colors */
  .tab-btn.active::before,
  .tab-btn.active::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: inherit;
    padding: 2px;
    background: conic-gradient(from var(--tab-angle), var(--sphere-1), var(--sphere-2), var(--sphere-3), var(--sphere-4), var(--sphere-1));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: tab-border-spin 3s linear infinite;
    pointer-events: none;
  }

  .tab-btn.active::before {
    filter: blur(6px);
    opacity: 0.8;
  }

  .panel[hidden] {
    display: none;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ---------- Assets placeholder grid ---------- */
  .assets-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px;
  }

  .asset-card {
    flex: 1 1 300px;
    max-width: 320px;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 22px;
    color: var(--text-soft);
    transition: border-color 0.25s ease, background 0.25s ease;
  }

  .asset-card:hover {
    border-color: rgba(255, 255, 255, 0.3);
    background: var(--surface-strong);
  }

  .asset-card .asset-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: var(--text);
  }

  .asset-card .asset-label {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
  }

  .asset-card .asset-sub {
    font-size: 0.8rem;
  }

  /* ---------- Cards ---------- */
  .card {
    position: relative;
    display: flex;
    align-items: stretch;
    min-height: 168px;
    border-radius: 22px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 14px 30px rgba(0, 0, 0, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07) inset, 0 22px 44px rgba(0, 0, 0, 0.5);
  }

  .card:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  /* Left accent panel: per-project color, holds the logo + badge */
  .card-visual {
    position: relative;
    width: 260px;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, var(--card-color) 0%, rgba(6, 7, 10, 0.92) 130%);
  }

  .card-glow {
    position: absolute;
    width: 220px;
    height: 220px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #fff;
    filter: blur(60px);
    opacity: 0.18;
    pointer-events: none;
  }

  /* Cards with real footage/screenshots: media fills the panel, a color
     wash keeps it tied to the project's accent, glow adds a soft highlight */
  .card-cover {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .card-media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.82;
  }

  .card-media-fallback {
    display: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .card-media-video { display: none; }
    .card-media-fallback { display: block; }
  }

  .card-tint {
    position: absolute;
    inset: 0;
    background: linear-gradient(155deg, var(--card-color) 0%, transparent 65%);
    opacity: 0.4;
    pointer-events: none;
  }

  .card-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    color: var(--bg);
    font-weight: 700;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-logo {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }

  .card-logo img {
    display: block;
    height: 57px;
    width: auto;
    max-width: 138px;
    object-fit: contain;
  }

  .card-logo .divider {
    width: 1px;
    height: 44px;
    background: rgba(59, 51, 42, 0.18);
  }

  .card-logo--dual img {
    max-width: 118px;
  }

  .card-visual--wide {
    width: 320px;
  }

  /* Right body: title + CTA */
  .card-body {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 0 30px;
    background: linear-gradient(165deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
  }

  .card-text h2 {
    margin: 0 0 6px;
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
  }

  .card-text span {
    font-size: 0.9rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
  }

  .card-cta {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1.1rem;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }

  .card:hover .card-cta {
    background: var(--card-color);
    border-color: transparent;
    transform: translateX(4px);
  }

  @media (max-width: 680px) {
    .logo-vradia { height: 99px; }
    .logo-hua, .logo-icsa { height: 49px; }

    .card { flex-direction: column; }
    .card-visual { width: 100%; padding: 22px 0; }
    .card-body { flex-direction: column; align-items: flex-start; padding: 20px 22px; gap: 14px; }
    .card-cta { align-self: flex-end; }
  }
</style>
</head>
<body>

  <div class="bg-scene" aria-hidden="true">    <div class="bg-spheres">
      <div class="bg-blob b1"></div>
      <div class="bg-blob b2"></div>
      <div class="bg-blob b3"></div>
      <div class="bg-blob b4"></div>
    </div>
    <div class="bg-noise"></div>
  </div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <header>
    <div class="logos">
      <a class="logo-chip" href="https://www.hua.gr/" target="_blank" rel="noopener">
        <img class="logo-hua" src="HUA_Logo.png" alt="Harokopio University of Athens logo">
      </a>
      <a href="#">
        <img class="logo-vradia" src="vradia_logo_stamp.png" alt="Βραδιά του Ερευνητή logo">
      </a>
      <a class="logo-chip" href="#">
        <img class="logo-icsa" src="icsa-logo.png" alt="ICSA logo">
      </a>
    </div>
  </header>

  <hr>

  <nav class="tabs">
    <button type="button" class="tab-btn active" data-tab="projects"><span class="tab-label">Research Projects</span></button>
    <button type="button" class="tab-btn" data-tab="assets"><span class="tab-label">Assets</span></button>
  </nav>

  <main>
    <div class="grid panel" id="panel-projects">

      <a class="card" style="--card-color: var(--card-mosaic);" href="Mosaic/index.html">
        <div class="card-visual">
          <div class="card-cover">
            <video class="card-media card-media-video" autoplay muted loop playsinline preload="auto" poster="Mosaic/demo.png">
              <source src="Mosaic/video.mp4" type="video/mp4">
            </video>
            <img class="card-media card-media-fallback" src="Mosaic/demo.png" alt="">
          </div>
          <div class="card-tint"></div>
          <div class="card-glow"></div>
          <div class="card-badge">A</div>
          <div class="card-logo"><img src="Mosaic/logo.png" alt="Mosaic logo"></div>
        </div>
        <div class="card-body">
          <div class="card-text">
            <h2>Mosaic</h2>
            <span>View project</span>
          </div>
          <div class="card-cta" aria-hidden="true">→</div>
        </div>
      </a>

      <a class="card" style="--card-color: var(--card-remerge);" href="Remerge/index.html">
        <div class="card-visual">
          <div class="card-glow"></div>
          <div class="card-badge">B</div>
          <div class="card-logo"><img src="Remerge/logo.svg" alt="Remerge logo"></div>
        </div>
        <div class="card-body">
          <div class="card-text">
            <h2>Remerge</h2>
            <span>View project</span>
          </div>
          <div class="card-cta" aria-hidden="true">→</div>
        </div>
      </a>

      <a class="card" style="--card-color: var(--card-codrones);" href="Codrones/index.html">
        <div class="card-visual">
          <div class="card-cover">
            <video class="card-media card-media-video" autoplay muted loop playsinline preload="auto" poster="Codrones/preview_poster.jpg">
              <source src="Codrones/fire_segmentation.mp4" type="video/mp4">
            </video>
            <img class="card-media card-media-fallback" src="Codrones/preview_poster.jpg" alt="">
          </div>
          <div class="card-tint"></div>
          <div class="card-glow"></div>
          <div class="card-badge">C</div>
          <div class="card-logo"><img src="Codrones/logo.png" alt="CoDrones logo"></div>
        </div>
        <div class="card-body">
          <div class="card-text">
            <h2>CoDrones</h2>
            <span>View project</span>
          </div>
          <div class="card-cta" aria-hidden="true">→</div>
        </div>
      </a>

      <a class="card" style="--card-color: var(--card-archipelago);" href="Archipelago/index.html">
        <div class="card-visual card-visual--wide">
          <div class="card-glow"></div>
          <div class="card-badge">D</div>
          <div class="card-logo card-logo--dual">
            <img src="Archipelago/logo_archipelago.svg" alt="Archipelago logo">
            <div class="divider"></div>
            <img src="K2W/logo.png" alt="K2W logo">
          </div>
        </div>
        <div class="card-body">
          <div class="card-text">
            <h2>Archipelago + K2W</h2>
            <span>View project</span>
          </div>
          <div class="card-cta" aria-hidden="true">→</div>
        </div>
      </a>

    </div>

    <div class="assets-grid panel" id="panel-assets" hidden>
      <div class="asset-card">
        <div class="asset-icon">1</div>
        <div class="asset-label">Coming soon</div>
        <div class="asset-sub">Asset placeholder</div>
      </div>
      <div class="asset-card">
        <div class="asset-icon">2</div>
        <div class="asset-label">Coming soon</div>
        <div class="asset-sub">Asset placeholder</div>
      </div>
      <div class="asset-card">
        <div class="asset-icon">3</div>
        <div class="asset-label">Coming soon</div>
        <div class="asset-sub">Asset placeholder</div>
      </div>
      <div class="asset-card">
        <div class="asset-icon">4</div>
        <div class="asset-label">Coming soon</div>
        <div class="asset-sub">Asset placeholder</div>
      </div>
      <div class="asset-card">
        <div class="asset-icon">5</div>
        <div class="asset-label">Coming soon</div>
        <div class="asset-sub">Asset placeholder</div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var tabs = document.querySelectorAll('.tab-btn');
      var panels = { projects: document.getElementById('panel-projects'), assets: document.getElementById('panel-assets') };

      tabs.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var target = btn.getAttribute('data-tab');
          tabs.forEach(function (b) { b.classList.toggle('active', b === btn); });
          Object.keys(panels).forEach(function (key) { panels[key].hidden = key !== target; });
        });
      });
    })();
  </script>
  <script src="assets/theme.js" defer></script>
</body>
</html>
