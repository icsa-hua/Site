<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Βραδιά του Ερευνητή — Research Projects</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root {
    --card-mosaic: #E8916B;
    --card-remerge: #3FC7B4;
    --card-codrones: #7B9FE0;
    --card-archipelago: #E0A855;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 64px;
  }

  /* ---------- Header ---------- */
  header {
    width: 100%;
    max-width: 1080px;
  }

  .logos {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding: 8px 0 28px;
  }

  .logos img {
    display: block;
    object-fit: contain;
  }

  .logo-hua { height: 60px; }
  .logo-icsa { height: 60px; }
  .logo-vradia {
    height: 122px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  }

  .logos > a:first-child { order: 1; }
  .logos > a:nth-child(2) { order: 2; margin: 0 auto; }
  .logos > a:last-child { order: 3; }

  hr {
    border: none;
    border-top: 1px solid var(--line);
    width: 100%;
    max-width: 1080px;
    margin: 0 0 40px;
  }

  .intro {
    width: 100%;
    max-width: 1080px;
    text-align: center;
    margin-bottom: 36px;
  }

  .intro h1 {
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0 0 10px;
  }

  .intro p {
    margin: 0;
    color: var(--text-soft);
    font-size: 0.98rem;
  }

  main {
    width: 100%;
    max-width: 1080px;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ---------- Cards ---------- */
  .card {
    position: relative;
    display: flex;
    align-items: stretch;
    min-height: 168px;
    border-radius: 22px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 14px 30px rgba(0, 0, 0, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07) inset, 0 22px 44px rgba(0, 0, 0, 0.5);
  }

  .card:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  /* Left accent panel: per-project color, holds the logo + badge */
  .card-visual {
    position: relative;
    width: 260px;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(155deg, var(--card-color) 0%, rgba(6, 7, 10, 0.92) 130%);
  }

  .card-glow {
    position: absolute;
    width: 220px;
    height: 220px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #fff;
    filter: blur(60px);
    opacity: 0.18;
    pointer-events: none;
  }

  .card-cover {
    position: absolute;
    inset: 0;
    background-image: var(--card-image, none);
    background-size: cover;
    background-position: center;
    opacity: 0.35;
    mix-blend-mode: overlay;
  }

  .card-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    color: var(--bg);
    font-weight: 700;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-logo {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }

  .card-logo img {
    display: block;
    height: 57px;
    width: auto;
    max-width: 138px;
    object-fit: contain;
  }

  .card-logo .divider {
    width: 1px;
    height: 44px;
    background: rgba(59, 51, 42, 0.18);
  }

  .card-logo--dual img {
    max-width: 118px;
  }

  .card-visual--wide {
    width: 320px;
  }

  /* Right body: title + CTA */
  .card-body {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 0 30px;
    background: linear-gradient(165deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
  }

  .card-text h2 {
    margin: 0 0 6px;
    font-size: 1.5rem;
    font-weight: 700;
    color: #fff;
  }

  .card-text span {
    font-size: 0.9rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.7);
  }

  .card-cta {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 1.1rem;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }

  .card:hover .card-cta {
    background: var(--card-color);
    border-color: transparent;
    transform: translateX(4px);
  }

  @media (max-width: 680px) {
    .logo-vradia { height: 99px; }
    .logo-hua, .logo-icsa { height: 49px; }

    .card { flex-direction: column; }
    .card-visual { width: 100%; padding: 22px 0; }
    .card-body { flex-direction: column; align-items: flex-start; padding: 20px 22px; gap: 14px; }
    .card-cta { align-self: flex-end; }
  }
</style>
</head>
<body>

  <div class="bg-scene" aria-hidden="true">    <div class="bg-spheres">
      <div class="bg-blob b1"></div>
      <div class="bg-blob b2"></div>
      <div class="bg-blob b3"></div>
      <div class="bg-blob b4"></div>
    </div>
    <div class="bg-noise"></div>
  </div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <header>
    <div class="logos">
      <a class="logo-chip" href="https://www.hua.gr/" target="_blank" rel="noopener">
        <img class="logo-hua" src="HUA_Logo.png" alt="Harokopio University of Athens logo">
      </a>
      <a href="#">
        <img class="logo-vradia" src="vradia_logo_stamp.png" alt="Βραδιά του Ερευνητή logo">
      </a>
      <a class="logo-chip" href="#">
        <img class="logo-icsa" src="icsa-logo.png" alt="ICSA logo">
      </a>
    </div>
  </header>

  <hr>

  <div class="intro">
    <h1 class="gradient-text">Research Projects</h1>
    <p>Explore our work — select a project below.</p>
  </div>

  <main>
    <div class="grid">

      <a class="card" style="--card-color: var(--card-mosaic); --card-image: url('Mosaic/cover.jpg');" href="Mosaic/index.html">
        <div class="card-visual">
          <div class="card-glow"></div>
          <div class="card-cover"></div>
          <div class="card-badge">A</div>
          <div class="card-logo"><img src="Mosaic/logo.png" alt="Mosaic logo"></div>
        </div>
        <div class="card-body">
          <div class="card-text">
            <h2>Mosaic</h2>
            <span>View project</span>
          </div>
          <div class="card-cta" aria-hidden="true">→</div>
        </div>
      </a>

      <a class="card" style="--card-color: var(--card-remerge); --card-image: url('Remerge/cover.jpg');" href="Remerge/index.html">
        <div class="card-visual">
          <div class="card-glow"></div>
          <div class="card-cover"></div>
          <div class="card-badge">B</div>
          <div class="card-logo"><img src="Remerge/logo.svg" alt="Remerge logo"></div>
        </div>
        <div class="card-body">
          <div class="card-text">
            <h2>Remerge</h2>
            <span>View project</span>
          </div>
          <div class="card-cta" aria-hidden="true">→</div>
        </div>
      </a>

      <a class="card" style="--card-color: var(--card-codrones); --card-image: url('Codrones/cover.jpg');" href="Codrones/index.html">
        <div class="card-visual">
          <div class="card-glow"></div>
          <div class="card-cover"></div>
          <div class="card-badge">C</div>
          <div class="card-logo"><img src="Codrones/logo.png" alt="CoDrones logo"></div>
        </div>
        <div class="card-body">
          <div class="card-text">
            <h2>CoDrones</h2>
            <span>View project</span>
          </div>
          <div class="card-cta" aria-hidden="true">→</div>
        </div>
      </a>

      <a class="card" style="--card-color: var(--card-archipelago); --card-image: url('Archipelago/cover.jpg');" href="Archipelago/index.html">
        <div class="card-visual card-visual--wide">
          <div class="card-glow"></div>
          <div class="card-cover"></div>
          <div class="card-badge">D</div>
          <div class="card-logo card-logo--dual">
            <img src="Archipelago/logo_archipelago.svg" alt="Archipelago logo">
            <div class="divider"></div>
            <img src="K2W/logo.png" alt="K2W logo">
          </div>
        </div>
        <div class="card-body">
          <div class="card-text">
            <h2>Archipelago + K2W</h2>
            <span>View project</span>
          </div>
          <div class="card-cta" aria-hidden="true">→</div>
        </div>
      </a>

    </div>
  </main>

  <script src="assets/theme.js" defer></script>
</body>
</html>
