<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Βραδιά του Ερευνητή — Research Projects</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  :root {
    --card-mosaic: #E8916B;
    --card-remerge: #3FC7B4;
    --card-codrones: #7B9FE0;
    --card-archipelago: #E0A855;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 64px;
  }

  /* ---------- Header ---------- */
  header {
    width: 100%;
    max-width: 1080px;
  }

  .logos {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    padding: 8px 0 28px;
  }

  .logos img {
    display: block;
    object-fit: contain;
  }

  .logo-hua { height: 46px; }
  .logo-icsa { height: 46px; }
  .logo-vradia {
    height: 94px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  }

  .logos > a:first-child { order: 1; }
  .logos > a:nth-child(2) { order: 2; margin: 0 auto; }
  .logos > a:last-child { order: 3; }

  hr {
    border: none;
    border-top: 1px solid var(--line);
    width: 100%;
    max-width: 1080px;
    margin: 0 0 40px;
  }

  .intro {
    width: 100%;
    max-width: 1080px;
    text-align: center;
    margin-bottom: 36px;
  }

  .intro h1 {
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0 0 10px;
  }

  .intro p {
    margin: 0;
    color: var(--text-soft);
    font-size: 0.98rem;
  }

  main {
    width: 100%;
    max-width: 1080px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 28px;
  }

  @media (max-width: 680px) {
    .grid { grid-template-columns: 1fr; }
    .logo-vradia { height: 76px; }
    .logo-hua, .logo-icsa { height: 38px; }
  }

  /* ---------- Cards ---------- */
  .card {
    position: relative;
    display: block;
    height: 260px;
    border-radius: 22px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    background: linear-gradient(165deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 14px 30px rgba(0, 0, 0, 0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07) inset, 0 22px 44px rgba(0, 0, 0, 0.5);
  }

  .card:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  .card-glow {
    position: absolute;
    width: 260px;
    height: 260px;
    right: -80px;
    bottom: -90px;
    border-radius: 50%;
    background: var(--card-color);
    filter: blur(70px);
    opacity: 0.5;
    pointer-events: none;
  }

  .card-cover {
    position: absolute;
    inset: 0;
    background-image: var(--card-image, none);
    background-size: cover;
    background-position: center;
    opacity: 0.5;
  }

  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(6, 7, 10, 0) 30%, rgba(6, 7, 10, 0.88) 100%);
  }

  .card-badge {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.92);
    color: var(--bg);
    font-weight: 700;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-text {
    position: absolute;
    left: 22px;
    right: 22px;
    bottom: 20px;
    color: #fff;
  }

  .card-text h2 {
    margin: 0 0 4px;
    font-size: 1.3rem;
    font-weight: 700;
  }

  .card-text span {
    font-size: 0.85rem;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.75);
  }

  .card-logo {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 12px;
    padding: 8px 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }

  .card-logo img {
    display: block;
    height: 37px;
    width: auto;
    max-width: 88px;
    object-fit: contain;
  }

  .card-logo .divider {
    width: 1px;
    height: 28px;
    background: rgba(59, 51, 42, 0.18);
  }
</style>
</head>
<body>

  <div class="bg-scene" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-spheres">
      <div class="bg-blob b1"></div>
      <div class="bg-blob b2"></div>
      <div class="bg-blob b3"></div>
      <div class="bg-blob b4"></div>
    </div>
    <div class="bg-noise"></div>
  </div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <header>
    <div class="logos">
      <a class="logo-chip" href="https://www.hua.gr/" target="_blank" rel="noopener">
        <img class="logo-hua" src="HUA_Logo.png" alt="Harokopio University of Athens logo">
      </a>
      <a href="#">
        <img class="logo-vradia" src="vradia_logo_stamp.png" alt="Βραδιά του Ερευνητή logo">
      </a>
      <a class="logo-chip" href="#">
        <img class="logo-icsa" src="icsa-logo.png" alt="ICSA logo">
      </a>
    </div>
  </header>

  <hr>

  <div class="intro">
    <h1 class="gradient-text">Research Projects</h1>
    <p>Explore our work — select a project below.</p>
  </div>

  <main>
    <div class="grid">

      <a class="card" style="--card-color: var(--card-mosaic); --card-image: url('Mosaic/cover.jpg');" href="Mosaic/index.html">
        <div class="card-glow"></div>
        <div class="card-cover"></div>
        <div class="card-overlay"></div>
        <div class="card-badge">A</div>
        <div class="card-logo"><img src="Mosaic/logo.png" alt="Mosaic logo"></div>
        <div class="card-text">
          <h2>Mosaic</h2>
          <span>View project →</span>
        </div>
      </a>

      <a class="card" style="--card-color: var(--card-remerge); --card-image: url('Remerge/cover.jpg');" href="Remerge/index.html">
        <div class="card-glow"></div>
        <div class="card-cover"></div>
        <div class="card-overlay"></div>
        <div class="card-badge">B</div>
        <div class="card-logo"><img src="Remerge/logo.svg" alt="Remerge logo"></div>
        <div class="card-text">
          <h2>Remerge</h2>
          <span>View project →</span>
        </div>
      </a>

      <a class="card" style="--card-color: var(--card-codrones); --card-image: url('Codrones/cover.jpg');" href="Codrones/index.html">
        <div class="card-glow"></div>
        <div class="card-cover"></div>
        <div class="card-overlay"></div>
        <div class="card-badge">C</div>
        <div class="card-logo"><img src="Codrones/logo.png" alt="CoDrones logo"></div>
        <div class="card-text">
          <h2>CoDrones</h2>
          <span>View project →</span>
        </div>
      </a>

      <a class="card" style="--card-color: var(--card-archipelago); --card-image: url('Archipelago/cover.jpg');" href="Archipelago/index.html">
        <div class="card-glow"></div>
        <div class="card-cover"></div>
        <div class="card-overlay"></div>
        <div class="card-badge">D</div>
        <div class="card-logo">
          <img src="Archipelago/logo_archipelago.svg" alt="Archipelago logo">
          <div class="divider"></div>
          <img src="K2W/logo.png" alt="K2W logo">
        </div>
        <div class="card-text">
          <h2>Archipelago + K2W</h2>
          <span>View project →</span>
        </div>
      </a>

    </div>
  </main>

  <script src="assets/theme.js" defer></script>
</body>
</html>
